name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Deny warnings in our own crate. Cargo applies `--cap-lints allow` to
  # dependencies, so this only gates pktkit's own code.
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (Linux, ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v6
      - name: Install ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Build (default features — must pull in zero dependencies)
        run: cargo build --verbose
      - name: Test (all features — lib, integration, and doc tests)
        run: cargo test --all-features --verbose

  robustness:
    name: Randomized robustness sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The fixed-seed sweep already runs as part of `cargo test`. This runs
      # the same bodies over fresh seeds, so CI explores new input over time
      # rather than re-testing one corpus forever. A failure prints the seed
      # and the exact bytes needed to reproduce it.
      - name: Sweep with rotating seeds
        run: |
          for i in 1 2 3 4 5; do
            seed=$(( ( $(date +%s) + i * 7919 ) % 4294967296 ))
            echo "--- seed $seed ---"
            PKTKIT_FUZZ_SEED=$seed cargo test --features "full fuzzing" --test robustness -- --nocapture
          done

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      # The interop suite is a workspace of its own.
      - run: cargo fmt --all --check --manifest-path interop/Cargo.toml

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  musl:
    name: Clippy (Linux musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # musl's libc differs from glibc in ways that only show at compile
      # time: ioctl takes a c_int request rather than c_ulong, and some time
      # aliases are deprecated. Checking needs no musl toolchain on the host.
      - run: cargo clippy --target x86_64-unknown-linux-musl --features full --all-targets -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --all-features --no-deps
      # Intra-doc links can resolve under --all-features and break for a user
      # who enabled one feature, so check a few subsets too.
      - name: Docs for feature subsets
        run: |
          for f in "" "pcap" "impair" "afpacket" "vtcp" "nat" "l2adapter dhcp"; do
            echo "--- features: ${f:-default} ---"
            cargo doc --no-deps ${f:+--features "$f"}
          done

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      # The whole surface, crypto included: purecrypto's own MSRV is 1.89,
      # exactly ours, so there is no dependency here that can drift past it
      # and fail this job for reasons no change in this repo could fix.
      - run: cargo check --all-features

  wasm:
    name: WebAssembly (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-unknown-unknown, wasm32-wasip1]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tests/wasm
      # No threads, no host sockets, and on unknown-unknown no clock: std
      # stubs all of those with functions that fail at run time, so a clean
      # build proves little on its own. The smoke module then runs under Node
      # (preinstalled on the runner) with the host driving every timer.
      - name: Build (all features)
        run: cargo build --target ${{ matrix.target }} --features full
      - name: Smoke test under Node
        run: |
          cargo build --release --manifest-path tests/wasm/Cargo.toml --target ${{ matrix.target }}
          node tests/wasm/run.mjs tests/wasm/target/${{ matrix.target }}/release/pktkit_wasm_smoke.wasm

  fullrust:
    name: Build + test (fullrust, libc-free Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # A Linux target without libc, outside the `unix` family: xdp and afxdp
      # make their syscalls themselves there. Build everything, then run the
      # xdp/afxdp unit tests, which exercise those syscalls on loopback.
      - name: Build (all features)
        uses: KarpelesLab/fullrust@master
        with:
          image: ghcr.io/karpeleslab/fullrust:latest
          args: --all-features --all-targets
      - name: Test (xdp, afxdp)
        uses: KarpelesLab/fullrust@master
        with:
          image: ghcr.io/karpeleslab/fullrust:latest
          command: test
          args: --features afxdp --lib -- xdp syscall

  macos:
    name: Build + test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `full` includes xdp and afxdp, which compile only on Linux; the modules
      # are gated on target_os, so --all-features must still build here. That
      # is the whole point of the gate, so test it rather than working around
      # it with a hand-listed feature set.
      - run: cargo build --all-features
      - run: cargo test --all-features

  windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # tuntap and afpacket fall back to Unsupported stubs here; nothing may
      # fail to compile.
      - run: cargo build --all-features

  bench:
    name: Benchmarks build and run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Timings from a shared runner are not worth recording, but a benchmark
      # that no longer compiles or panics is.
      - run: cargo bench

  fuzz:
    name: Fuzz targets build
    runs-on: ubuntu-latest
    env:
      # cargo-fuzz shells out to `cargo build` with `-Zsanitizer`, and that
      # inner cargo resolves the toolchain itself -- it picked up the runner's
      # default stable and failed on the nightly-only flag. Pinning the
      # toolchain for the whole job settles it for every nested invocation.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build every target
        run: cargo fuzz build
      # A short run on each target catches anything the stable sweep misses
      # without turning CI into a fuzzing farm.
      - name: Smoke-run each target
        run: |
          for t in $(cargo fuzz list); do
            echo "--- $t ---"
            cargo fuzz run "$t" -- -max_total_time=20 -print_final_stats=1
          done

  interop:
    name: Interop (vtcp against Linux in QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # The guest agent is a static musl binary, linked with rust-lld.
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: interop
      # GitHub's Linux runners have KVM, but /dev/kvm is root's alone.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
      # The guest's kernel and busybox come from Alpine; key the cache by the
      # kernel build the branch has now, so a new one is fetched once. The
      # branch is interop/src/image.rs's ALPINE_BRANCH.
      - name: Look up the Alpine kernel
        id: alpine
        run: |
          v=$(curl -fsSL https://dl-cdn.alpinelinux.org/alpine/v3.24/main/x86_64/APKINDEX.tar.gz \
            | tar -xzO APKINDEX | awk '/^P:linux-virt$/ {f=1} f && /^V:/ && !done {print substr($0, 3); done = 1}')
          echo "kernel=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: interop/.cache
          key: interop-alpine-v3.24-x86_64-${{ steps.alpine.outputs.kernel }}
          restore-keys: interop-alpine-v3.24-x86_64-
      - name: Clippy (harness and agent)
        working-directory: interop
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy -p pktkit-interop-agent --target x86_64-unknown-linux-musl -- -D warnings
      - name: Unit tests of the harness
        run: cargo test --release --manifest-path interop/Cargo.toml
      # The quick matrix: correctness, negotiation both ways, and two
      # impaired links. The full one runs locally (see interop/README.md).
      # The harness ends itself (and the guest) past --deadline; the step's
      # own limit is the backstop should that fail too.
      - name: Run the interop suite
        timeout-minutes: 14
        run: cargo run --release --manifest-path interop/Cargo.toml -- --arch x86_64 --quick --deadline 720
      - name: Keep the results (pcaps, console, report)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: interop-results
          path: interop/target/results
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      # The minimal, audited dependency list is a selling point of this crate,
      # so it gets checked rather than asserted: advisories, licences, and any
      # dependency that sneaks in without being declared.
      - run: cargo deny --all-features check
